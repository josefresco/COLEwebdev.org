/* ── Cape Cod Social Media Marketing page ── */

/* Hero — CSS gradient, brand navy */
.sm-hero {
  position: relative;
  overflow: hidden;
  min-height: 52vh;
  display: flex;
  align-items: center;
}
.sm-hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 110% -10%, rgba(92,192,53,0.28), transparent 60%),
    radial-gradient(ellipse 60% 80% at -10% 110%, rgba(33,146,188,0.2), transparent 60%),
    linear-gradient(160deg, #0E2A4A 0%, #14385C 45%, #1B4A77 100%);
}
.sm-hero-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    -45deg,
    transparent, transparent 48px,
    rgba(255,255,255,0.018) 48px, rgba(255,255,255,0.018) 49px
  );
}
.sm-hero-content {
  position: relative;
  z-index: 1;
  padding: 100px 0 96px;
  width: 100%;
}
.sm-eyebrow {
  color: var(--brand-green) !important;
}
.sm-eyebrow::before {
  background: var(--brand-green) !important;
}
.sm-hero-hl {
  font-family: var(--serif);
  font-size: clamp(36px, 5.5vw, 76px);
  line-height: 1.08;
  margin: 18px 0 22px;
  font-weight: 400;
  color: white;
  max-width: 18ch;
}
.sm-hero-hl em { font-style: italic; color: var(--brand-green); }
.sm-hero-sub {
  font-size: clamp(15px, 1.6vw, 18px);
  color: rgba(255,255,255,0.72);
  max-width: 52ch;
  line-height: 1.7;
  margin: 0 0 36px;
}
.sm-hero-actions {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
}
.sm-ghost {
  color: rgba(255,255,255,0.7) !important;
  border-color: rgba(255,255,255,0.22) !important;
}

/* Services grid */
.sm-services {
  padding: var(--pad-section) 0;
  background: white;
}
.sm-services-hd {
  margin-bottom: 48px;
}
.sm-services-hl {
  font-family: var(--serif);
  font-size: clamp(28px, 3.2vw, 42px);
  color: var(--ink);
  font-weight: 400;
  margin: 12px 0 10px;
}
.sm-services-sub {
  font-size: 16px;
  color: var(--muted);
  max-width: 56ch;
  line-height: 1.6;
  margin: 0;
}
.sm-services-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}
.sm-svc-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: transform 0.22s ease, box-shadow 0.22s ease;
}
.sm-svc-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}
.sm-svc-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(92,192,53,0.12);
  color: var(--brand-green-deep, #3a8c1e);
  display: grid;
  place-items: center;
  font-size: 18px;
  flex-shrink: 0;
}
.sm-svc-name {
  font-family: var(--serif);
  font-size: 20px;
  color: var(--ink);
  font-weight: 400;
  margin: 0;
}
.sm-svc-body {
  font-size: 14px;
  line-height: 1.7;
  color: var(--muted);
  margin: 0;
}

/* Platforms */
.sm-platforms {
  padding: var(--pad-section) 0;
  background: var(--paper);
  border-top: 1px solid var(--line);
}
.sm-platforms-hd {
  margin-bottom: 48px;
}
.sm-platforms-hl {
  font-family: var(--serif);
  font-size: clamp(28px, 3.2vw, 42px);
  color: var(--ink);
  font-weight: 400;
  margin: 12px 0 10px;
}
.sm-platforms-hl em { font-style: italic; color: var(--brand-blue); }
.sm-platforms-sub {
  font-size: 16px;
  color: var(--muted);
  max-width: 52ch;
  line-height: 1.6;
  margin: 0;
}
.sm-platforms-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}
.sm-platform-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 30px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--shadow-sm);
}
.sm-platform-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(33,146,188,0.1);
  color: var(--brand-blue);
  display: grid;
  place-items: center;
  font-size: 18px;
  flex-shrink: 0;
}
.sm-platform-name {
  font-family: var(--serif);
  font-size: 20px;
  color: var(--ink);
  font-weight: 400;
  margin: 0;
}
.sm-platform-body {
  font-size: 14px;
  line-height: 1.7;
  color: var(--muted);
  margin: 0;
}

/* Why section */
.sm-why {
  padding: var(--pad-section) 0;
  background: white;
}
.sm-why-grid {
  display: grid;
  grid-template-columns: 1fr 420px;
  gap: 80px;
  align-items: start;
}
.sm-why-body {
  display: flex;
  flex-direction: column;
}
.sm-why-hl {
  font-family: var(--serif);
  font-size: clamp(28px, 3.2vw, 42px);
  line-height: 1.18;
  margin: 12px 0 24px;
  color: var(--ink);
  font-weight: 400;
}
.sm-why-hl em { font-style: italic; color: var(--brand-blue); }
.sm-body {
  font-size: clamp(15px, 1.4vw, 16px);
  line-height: 1.78;
  color: var(--ink-2);
  max-width: 52ch;
  margin: 0 0 18px;
}
.sm-why-reasons {
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: sticky;
  top: 32px;
}
.sm-reason {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px 22px;
}
.sm-reason-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: rgba(92,192,53,0.12);
  color: var(--brand-green-deep, #3a8c1e);
  display: grid;
  place-items: center;
  font-size: 16px;
  flex-shrink: 0;
}
.sm-reason-label {
  font-family: var(--serif);
  font-size: 17px;
  color: var(--ink);
  font-weight: 400;
  margin-bottom: 5px;
}
.sm-reason-desc {
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--muted);
  margin: 0;
}

/* Paid social steps */
.sm-paid {
  padding: var(--pad-section) 0;
  background: var(--navy);
  position: relative;
  overflow: hidden;
}
.sm-paid::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    -45deg,
    transparent, transparent 40px,
    rgba(255,255,255,0.015) 40px, rgba(255,255,255,0.015) 41px
  );
}
.sm-paid-hd {
  margin-bottom: 52px;
  position: relative;
  z-index: 1;
}
.sm-paid .eyebrow { color: var(--brand-green); }
.sm-paid .eyebrow::before { background: var(--brand-green); }
.sm-paid-hl {
  font-family: var(--serif);
  font-size: clamp(28px, 3.2vw, 42px);
  color: white;
  font-weight: 400;
  margin: 12px 0 10px;
}
.sm-paid-sub {
  font-size: 16px;
  color: rgba(255,255,255,0.65);
  max-width: 54ch;
  line-height: 1.65;
  margin: 0;
}
.sm-paid-steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  position: relative;
  z-index: 1;
}
.sm-paid-step {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--r-lg);
  padding: 32px 26px 28px;
  backdrop-filter: blur(4px);
}
.sm-paid-num {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--brand-green);
  margin-bottom: 8px;
}
.sm-paid-label {
  font-family: var(--serif);
  font-size: 22px;
  color: white;
  font-weight: 400;
  margin-bottom: 12px;
}
.sm-paid-body {
  font-size: 13.5px;
  line-height: 1.65;
  color: rgba(255,255,255,0.68);
  margin: 0;
}

/* Testimonial */
.sm-testi {
  padding: var(--pad-section) 0;
  background: var(--paper);
}
.sm-testi-inner {
  max-width: 760px;
  margin: 0 auto;
  text-align: center;
}
.sm-quote-mark {
  font-family: var(--serif);
  font-size: 96px;
  line-height: 0.5;
  color: var(--brand-blue);
  opacity: 0.22;
  display: block;
  margin-bottom: 16px;
}
.sm-quote {
  font-family: var(--serif);
  font-size: clamp(19px, 2.2vw, 25px);
  line-height: 1.6;
  color: var(--ink);
  font-style: italic;
  margin: 0 0 32px;
  border: none;
  padding: 0;
}
.sm-testi-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.sm-testi-img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: var(--shadow-md);
}
.sm-testi-name {
  font-weight: 600;
  font-size: 14px;
  text-align: left;
}
.sm-testi-role {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 3px;
  text-align: left;
}

/* CTA */
.sm-cta-section { padding: var(--pad-section) 0; background: white; }
.sm-cta {
  background: var(--ink);
  border-radius: var(--r-xl);
  padding: 64px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 40px;
  align-items: center;
}
.sm-cta-hl {
  font-family: var(--serif);
  font-size: clamp(26px, 3vw, 38px);
  color: white;
  margin: 0 0 12px;
  font-weight: 400;
}
.sm-cta-hl em { font-style: italic; color: var(--brand-green); }
.sm-cta-sub {
  color: rgba(255,255,255,0.65);
  font-size: 15px;
  line-height: 1.65;
  max-width: 48ch;
  margin: 0;
}
.sm-cta-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
}

/* Service area note + related links */
.sm-area-note { font-size: 13px; color: rgba(255,255,255,0.45); margin: 8px 0 0; }
.sm-area-note a { color: var(--brand-green); }
.sm-related { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
.sm-related-label { font-size: 11px; font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
.sm-related-link { font-size: 13px; color: rgba(255,255,255,0.7); text-decoration: none; }
.sm-related-link:hover { color: white; }

/* Responsive */
@media (max-width: 1024px) {
  .sm-why-grid { grid-template-columns: 1fr; gap: 48px; }
  .sm-why-reasons { position: static; }
  .sm-platforms-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 960px) {
  .sm-services-grid { grid-template-columns: repeat(2, 1fr); }
  .sm-paid-steps { grid-template-columns: repeat(2, 1fr); }
  .sm-cta { grid-template-columns: 1fr; }
  .sm-cta-actions { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
}
@media (max-width: 560px) {
  .sm-services-grid { grid-template-columns: 1fr; }
  .sm-platforms-grid { grid-template-columns: 1fr; }
  .sm-paid-steps { grid-template-columns: 1fr; }
  .sm-cta { padding: 36px 28px; }
  .sm-hero-actions { flex-direction: column; align-items: flex-start; }
}
