<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is the difference between the free SEO snapshot and the full audit?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The free snapshot is a quick outside-in review of your site and Google Business Profile that flags the most obvious problems. The full audit is a paid, in-depth engagement: we connect to your Google Analytics and Search Console data, crawl the whole site, and deliver a prioritized report of every issue we find."
      }
    },
    {
      "@type": "Question",
      "name": "Do you fix the problems or just report them?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We fix them. Remediation is a separate engagement after the audit: we work through the report in priority order, fix the issues directly on your site, and verify each fix in Search Console."
      }
    },
    {
      "@type": "Question",
      "name": "Do you need access to my Google accounts?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For the full audit, yes: read access to Google Analytics and Search Console lets us diagnose problems from your real traffic and indexing data instead of guesses. The free snapshot needs no access at all."
      }
    },
    {
      "@type": "Question",
      "name": "Do you offer monthly SEO retainers?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. We focus on audits and remediation: find what is holding your site back, fix it, and verify the fix. Many clients come back for a fresh audit after a redesign, a platform move, or a drop in traffic."
      }
    },
    {
      "@type": "Question",
      "name": "How long does it take to see results after remediation?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Technical fixes like indexing and crawl errors can show up in Search Console within weeks. Ranking changes usually take longer and depend on your competition. Our guide on how long SEO takes covers realistic timelines."
      }
    }
  ]
}
</script>
