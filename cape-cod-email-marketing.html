<style>
/* ── Email Marketing page ── */

/* Hero */
.em-hero {
  position: relative;
  overflow: hidden;
  min-height: 52vh;
  display: flex;
  align-items: center;
}
.em-hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 110% -10%, rgba(92,192,53,0.3), transparent 60%),
    radial-gradient(ellipse 60% 80% at -10% 110%, rgba(0,115,170,0.2), transparent 60%),
    linear-gradient(160deg, #0E2A4A 0%, #0D3520 45%, #14452C 100%);
}
.em-hero-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    -45deg,
    transparent, transparent 48px,
    rgba(255,255,255,0.018) 48px, rgba(255,255,255,0.018) 49px
  );
}
.em-hero-content {
  position: relative;
  z-index: 1;
  padding: 100px 0 96px;
  width: 100%;
}
.em-eyebrow {
  color: var(--brand-green) !important;
}
.em-eyebrow::before {
  background: var(--brand-green) !important;
}
.em-hero-hl {
  font-family: var(--serif);
  font-size: clamp(36px, 5.5vw, 76px);
  line-height: 1.08;
  margin: 18px 0 22px;
  font-weight: 400;
  color: white;
  max-width: 16ch;
}
.em-hero-hl em { font-style: italic; color: var(--brand-green); }
.em-hero-sub {
  font-size: clamp(15px, 1.6vw, 18px);
  color: rgba(255,255,255,0.72);
  max-width: 52ch;
  line-height: 1.7;
  margin: 0 0 36px;
}
.em-hero-actions {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
}
.em-ghost {
  color: rgba(255,255,255,0.7) !important;
  border-color: rgba(255,255,255,0.22) !important;
}

/* What's included */
.em-included {
  padding: var(--pad-section) 0;
  background: white;
}
.em-included-hd {
  margin-bottom: 48px;
}
.em-included-hl {
  font-family: var(--serif);
  font-size: clamp(28px, 3.2vw, 42px);
  color: var(--ink);
  font-weight: 400;
  margin: 12px 0 10px;
}
.em-included-sub {
  font-size: 16px;
  color: var(--muted);
  max-width: 54ch;
  line-height: 1.6;
  margin: 0;
}
.em-included-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}
.em-inc-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: transform 0.22s ease, box-shadow 0.22s ease;
}
.em-inc-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}
.em-inc-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(92,192,53,0.12);
  color: var(--brand-green-deep, #3a8a1f);
  display: grid;
  place-items: center;
  font-size: 18px;
  flex-shrink: 0;
}
.em-inc-name {
  font-family: var(--serif);
  font-size: 20px;
  color: var(--ink);
  font-weight: 400;
  margin: 0;
}
.em-inc-body {
  font-size: 14px;
  line-height: 1.7;
  color: var(--muted);
  margin: 0;
}

/* Why email section */
.em-why {
  padding: var(--pad-section) 0;
  background: var(--paper);
}
.em-why-grid {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 80px;
  align-items: start;
}
.em-why-stats {
  display: flex;
  flex-direction: column;
  gap: 32px;
  position: sticky;
  top: 32px;
}
.em-stat {
  border-left: 3px solid var(--brand-green);
  padding-left: 20px;
}
.em-stat-num {
  display: block;
  font-family: var(--serif);
  font-size: clamp(36px, 4vw, 52px);
  line-height: 1;
  color: var(--ink);
  font-weight: 400;
  margin-bottom: 6px;
}
.em-stat-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--muted);
  line-height: 1.5;
  display: block;
}
.em-why-body {
  display: flex;
  flex-direction: column;
}
.em-why-hl {
  font-family: var(--serif);
  font-size: clamp(28px, 3.2vw, 42px);
  line-height: 1.18;
  margin: 12px 0 24px;
  color: var(--ink);
  font-weight: 400;
}
.em-why-hl em { font-style: italic; color: var(--brand-blue); }
.em-body {
  font-size: clamp(15px, 1.4vw, 16px);
  line-height: 1.78;
  color: var(--ink-2);
  max-width: 52ch;
  margin: 0 0 18px;
}

/* Platforms */
.em-platforms {
  padding: var(--pad-section) 0;
  background: var(--navy);
  position: relative;
  overflow: hidden;
}
.em-platforms::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    -45deg,
    transparent, transparent 40px,
    rgba(255,255,255,0.015) 40px, rgba(255,255,255,0.015) 41px
  );
}
.em-platforms-hd {
  margin-bottom: 52px;
  position: relative;
  z-index: 1;
}
.em-platforms .eyebrow { color: var(--brand-green); }
.em-platforms .eyebrow::before { background: var(--brand-green); }
.em-platforms-hl {
  font-family: var(--serif);
  font-size: clamp(28px, 3.2vw, 42px);
  color: white;
  font-weight: 400;
  margin: 12px 0 14px;
}
.em-platforms-sub {
  font-size: 15px;
  color: rgba(255,255,255,0.65);
  max-width: 56ch;
  line-height: 1.65;
  margin: 0;
}
.em-platforms-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  position: relative;
  z-index: 1;
}
.em-platform-card {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--r-lg);
  padding: 36px 28px;
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.em-platform-icon {
  font-size: 20px;
  color: var(--brand-green);
  margin-bottom: 4px;
}
.em-platform-name {
  font-family: var(--serif);
  font-size: 22px;
  color: white;
  font-weight: 400;
  margin: 0;
}
.em-platform-body {
  font-size: 13.5px;
  line-height: 1.65;
  color: rgba(255,255,255,0.68);
  margin: 0;
}

/* Seasonal */
.em-seasonal {
  padding: var(--pad-section) 0;
  background: var(--paper-2);
  border-top: 1px solid var(--line);
}
.em-seasonal-hd {
  margin-bottom: 44px;
}
.em-seasonal-hl {
  font-family: var(--serif);
  font-size: clamp(28px, 3.2vw, 42px);
  color: var(--ink);
  font-weight: 400;
  margin: 12px 0 14px;
}
.em-seasonal-hl em { font-style: italic; color: var(--brand-blue); }
.em-seasonal-sub {
  font-size: 16px;
  color: var(--muted);
  max-width: 58ch;
  line-height: 1.6;
  margin: 0;
}
.em-seasonal-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}
.em-season-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 28px 28px;
  display: flex;
  align-items: flex-start;
  gap: 18px;
  box-shadow: var(--shadow-sm);
}
.em-season-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(92,192,53,0.12);
  color: var(--brand-green-deep, #3a8a1f);
  display: grid;
  place-items: center;
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 2px;
}
.em-season-label {
  font-family: var(--serif);
  font-size: 19px;
  color: var(--ink);
  font-weight: 400;
  margin-bottom: 6px;
}
.em-season-desc {
  font-size: 14px;
  line-height: 1.65;
  color: var(--muted);
  margin: 0;
}

/* CTA */
.em-cta-section { padding: var(--pad-section) 0; background: white; }
.em-cta {
  background: var(--ink);
  border-radius: var(--r-xl);
  padding: 64px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 40px;
  align-items: center;
}
.em-cta-hl {
  font-family: var(--serif);
  font-size: clamp(26px, 3vw, 38px);
  color: white;
  margin: 0 0 12px;
  font-weight: 400;
}
.em-cta-hl em { font-style: italic; color: var(--brand-green); }
.em-cta-sub {
  color: rgba(255,255,255,0.65);
  font-size: 15px;
  line-height: 1.65;
  max-width: 48ch;
  margin: 0;
}
.em-cta-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
}
.em-area-note { font-size: 13px; color: rgba(255,255,255,0.45); margin: 8px 0 0; }
.em-area-note a { color: var(--brand-green); }

/* Responsive */
@media (max-width: 1024px) {
  .em-why-grid { grid-template-columns: 240px 1fr; gap: 56px; }
  .em-why-stats { position: static; }
}
@media (max-width: 960px) {
  .em-why-grid { grid-template-columns: 1fr; gap: 48px; }
  .em-why-stats { flex-direction: row; gap: 24px; flex-wrap: wrap; }
  .em-stat { flex: 1 1 160px; }
  .em-included-grid { grid-template-columns: repeat(2, 1fr); }
  .em-platforms-grid { grid-template-columns: 1fr; }
  .em-cta { grid-template-columns: 1fr; }
  .em-cta-actions { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
}
@media (max-width: 560px) {
  .em-included-grid { grid-template-columns: 1fr; }
  .em-seasonal-grid { grid-template-columns: 1fr; }
  .em-cta { padding: 36px 28px; }
  .em-hero-actions { flex-direction: column; align-items: flex-start; }
}
</style>
